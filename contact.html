<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Aesthetic Aura</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>
    <main class="contact-container">
        <section class="contact-info">
            <h2>Get in Touch</h2>
            <p>We’d love to hear from you! Feel free to reach out through any of the channels below:</p>
            <ul>
                <li><strong>Email:</strong> <a href="mailto:AestheticAura@gmail.com">AestheticAura@gmail.com</a></li>
                <li><strong>Instagram:</strong> <a href="https://instagram.com/AestheticAura" target="_blank">@AestheticAura</a></li>
                <li><strong>Location:</strong> FAST CFD, Pakistan</li>
            </ul>
        </section>
        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Your Name" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Your Email" required>
                
                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Your Message" rows="5" required></textarea>
                
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Aesthetic Aura. All rights reserved.</p>
    </footer>
</body>
</html>
